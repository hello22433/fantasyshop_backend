name: Deploy to EC2

on:
  push:
    branches:
#      - main
# 푸쉬용 e e e

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ 코드 받아오기
        uses: actions/checkout@v3

      - name: 🛠️ JAR 빌드 (Gradle)
        run: ./gradlew clean build -x test

      - name: 🔧 Docker Buildx 설정 !
        uses: docker/setup-buildx-action@v2

      - name: 🔑 DockerHub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Docker 이미지 빌드 & 푸시
        run: |
          docker build -t leesejoon/fantasyshop-backend:latest .
          docker push leesejoon/fantasyshop-backend:latest

      - name: 🚀 EC2에 SSH 접속 후 배포
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 최신 이미지 pull
            docker pull leesejoon/fantasyshop-backend:latest

            # 수동으로 떠 있을 수 있는 redis 컨테이너 강제 삭제
            docker rm -f redis || true

            # docker-compose 컨테이너 중지 및 삭제
            docker-compose -f /home/ec2-user/docker-compose.yml down

            # docker-compose로 redis와 app 함께 재실행 (.env 환경변수 적용)
            docker-compose --env-file /home/ec2-user/.env -f /home/ec2-user/docker-compose.yml up -d
