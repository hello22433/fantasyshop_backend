name: Deploy to EC2

on:
  push:
    branches:
#      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ 코드 받아오기
        uses: actions/checkout@v3

      - name: 🛠️ JAR 빌드 (Gradle)
        run: ./gradlew clean build -x test

      - name: 🔧 Docker Buildx 설정 !
        uses: docker/setup-buildx-action@v2

      - name: 🔑 DockerHub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Docker 이미지 빌드 & 푸시
        run: |
          docker build -t leesejoon/fantasyshop-backend:latest .
          docker push leesejoon/fantasyshop-backend:latest

      - name: 🚀 EC2에 SSH 접속 후 배포
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull leesejoon/fantasyshop-backend:latest

            # 🔄 Redis가 없을 때만 실행
            if [ "$(docker ps -a -q -f name=^redis$)" = "" ]; then
              echo "🔄 Redis가 실행 중이 아님. 새로 시작합니다."
              docker run -d --restart=always --name redis -p 6379:6379 redis:latest
            else
              echo "✅ Redis가 이미 실행 중입니다. 유지합니다."
            fi

            # 기존 백엔드 컨테이너 중지 및 삭제
            docker stop fantasyshop-backend-container || true
            docker rm fantasyshop-backend-container || true

            # 새 백엔드 실행
            docker run --env-file /home/ec2-user/.env \
              -d --name fantasyshop-backend-container \
              -p 8080:8080 \
              leesejoon/fantasyshop-backend:latest
