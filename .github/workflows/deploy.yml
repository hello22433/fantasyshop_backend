name: Deploy to EC2

on:
  push:
    branches:
#      - main  # main 브랜치에 푸시될 때만 실행
# 푸쉬 푸쉬 vt vt

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ 코드 받아오기
        uses: actions/checkout@v3

      - name: 🛠️ JAR 빌드 (Gradle)
        run: ./gradlew clean build -x test

      - name: 🔧 Docker Buildx 설정 !
        uses: docker/setup-buildx-action@v2

      - name: 🔑 DockerHub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Docker 이미지 빌드 & 푸시
        run: |
          docker build -t leesejoon/fantasyshop-backend:latest .
          docker push leesejoon/fantasyshop-backend:latest

      - name: 🚀 EC2에 SSH 접속 후 배포
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull leesejoon/fantasyshop-backend:latest

#             Redis 컨테이너가 이미 존재하면 중지하고 삭제
#            docker ps -a -q --filter "name=^redis$" | grep -q . && docker stop redis && docker rm redis || echo "✅ Redis 없음"

            # 백엔드 컨테이너도 중지하고 삭제
            docker stop fantasyshop-backend-container || true
            docker rm fantasyshop-backend-container || true

#            Redis 실행
#            docker run -d --name redis -p 6379:6379 redis:latest
            
            # Redis가 없을 경우에만 실행
            if [ "$(docker ps -a -q -f name=^redis$)" = "" ]; then
              echo "🔄 Redis가 실행 중이 아님. 새로 시작합니다."
              docker run -d --name redis -p 6379:6379 redis:latest
            else
              echo "✅ Redis가 이미 실행 중입니다. 유지합니다."
            fi

            # 백엔드 실행
            docker run --env-file .env -d --name fantasyshop-backend-container -p 8080:8080 leesejoon/fantasyshop-backend:latest

